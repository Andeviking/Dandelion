name: CI Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/node-implementation
    paths:
      - docker/ci.Dockerfile
      - .github/workflows/ci-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push CI toolchain image
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/andeviking/dandelion-ci:toolchain-v1
          build-args: |
            BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max
