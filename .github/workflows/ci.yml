name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DANDELION_DEPENDENCY_MODE: EXISTING
  DANDELION_WARNINGS_AS_ERRORS: 'ON'
  DANDELION_SUBPROJECTS_DIR: /opt/dandelion/subprojects

# Publish docker/ci.Dockerfile's image before enabling CI. Use a public image
# for fork PRs and set DANDELION_CI_IMAGE to its digest to pin CI runs.
jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.DANDELION_CI_IMAGE || 'ghcr.io/andeviking/dandelion-ci:toolchain-v1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-asan-ubsan
            preset: gcc-asan-ubsan
            cc: gcc
            cxx: g++
          - name: gcc-release
            preset: release
            cc: gcc
            cxx: g++
          - name: clang-debug
            preset: clang-debug
            cc: clang
            cxx: clang++
          - name: clang-release
            preset: release
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_DIR: build/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure
        env:
          PRESET: ${{ matrix.preset }}
          BUILD_BENCHMARKS: ${{ matrix.name == 'clang-debug' && 'ON' || 'OFF' }}
        run: |
          cmake --preset "$PRESET" -B "$BUILD_DIR" \
            -DDANDELION_BUILD_TESTS=ON \
            -DDANDELION_BUILD_BENCHMARKS="$BUILD_BENCHMARKS" \
            -DDANDELION_DEPENDENCY_MODE="$DANDELION_DEPENDENCY_MODE" \
            -DDANDELION_WARNINGS_AS_ERRORS="$DANDELION_WARNINGS_AS_ERRORS" \
            -DDANDELION_SUBPROJECTS_DIR="$DANDELION_SUBPROJECTS_DIR"
      - name: Build
        run: cmake --build "$BUILD_DIR"
      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure --no-tests=error
      - name: Check C++ naming
        if: matrix.name == 'clang-debug'
        run: python3 scripts/check_cpp.py tidy --build-dir build/clang-debug

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.DANDELION_CI_IMAGE || 'ghcr.io/andeviking/dandelion-ci:toolchain-v1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # A push may need to fetch its previous tip from a private repository.
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            git diff --check "$MERGE_BASE" "$HEAD_SHA" -- . ':!LICENSES/**'
          else
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA=$(git hash-object -w -t tree --stdin < /dev/null)
            elif ! git cat-file -e "$BASE_SHA^{commit}"; then
              # The previous tip may be unreachable after a force push.
              git fetch --no-tags origin "$BASE_SHA"
            fi
            git diff --check "$BASE_SHA" "$HEAD_SHA" -- . ':!LICENSES/**'
          fi
      - name: Check C++ formatting
        run: python3 scripts/check_cpp.py format-check

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.DANDELION_CI_IMAGE || 'ghcr.io/andeviking/dandelion-ci:toolchain-v1' }}
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure documentation
        run: |
          cmake -S . -B build/docs -G Ninja \
            -DDANDELION_BUILD_DOCS=ON -DDANDELION_BUILD_TESTS=OFF \
            -DDANDELION_DEPENDENCY_MODE="$DANDELION_DEPENDENCY_MODE" \
            -DDANDELION_WARNINGS_AS_ERRORS="$DANDELION_WARNINGS_AS_ERRORS"
      - name: Generate and verify documentation
        run: |
          cmake --build build/docs --target dandelion_docs
          test -s build/docs/docs/html/index.html
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-docs
          path: build/docs/docs/html/
          if-no-files-found: error

  ci-required:
    name: CI required
    runs-on: ubuntu-24.04
    needs: [build-and-test, quality, docs]
    if: always()
    steps:
      - name: Require all CI jobs to pass
        env:
          BUILD_AND_TEST_RESULT: ${{ needs.build-and-test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          printf 'Build and test: %s\nQuality: %s\nDocumentation: %s\n' \
            "$BUILD_AND_TEST_RESULT" "$QUALITY_RESULT" "$DOCS_RESULT"
          [[ "$BUILD_AND_TEST_RESULT" == success && "$QUALITY_RESULT" == success && \
            "$DOCS_RESULT" == success ]]
